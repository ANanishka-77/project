<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="dapp.css" />
  </head>
  <body>
    <h1 id="firstHead">Discussion Portal</h1>

    <div class="container" style="background-color: whitesmoke">
      <!--pure page ka main container h-->
      <div class="twoBox" id="leftcontainer">
        <div>
          <button id="newQuestionForm">New Question form</button>
          <input
            type="search"
            placeholder="search questions..."
            id="questionSearch"
          />
        </div>
        <div id="dataList"></div>
      </div>

      <div class="twoBox" style="display: block" id="rightContainer">
        <div id="toggleDisplay">
          <div id="rightDiv">
            <input type="text" id="subject" placeholder="Subject" />
          </div>
          <div id="rightDiv">
            <textarea
              id="question"
              placeholder="Write your query description here..."
            ></textarea>
          </div>
          <div style="float: right">
            <button type="button" id="submitBtn">Submit</button>
          </div>
        </div>
        <div id="respondQue"></div>
        <div id="resolveHolder" style="display: none">
          <button id="resolveQuestion">Resolve</button>
          <button id="upvote">upvote</button>
          <button id="downvote">downvote</button>
        </div>
        <div id="responseAns"></div>
        <div id="commentHolder" style="display: none">
          <input id="pickName" placeholder="Name please..." />
          <textarea
            name=""
            id="pickComment"
            placeholder="Please write your answer here..."
          ></textarea>
          <button id="commentBtn">Comment</button>
        </div>
      </div>
    </div>
    <script src="dapp.js"></script>
  </body>
</html>
