<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discussion Portal</title>
    <link rel="stylesheet" href="dapp.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <h1 id="firstHead">Discussion Portal</h1>
    <div class="container">
      <div class="twoBox" id="leftcontainer">
        <div>
          <button id="newQuestionForm">New Question form</button>

          <input
            type="search"
            placeholder="search questions..."
            id="questionSearch"
          />
        </div>
        <div id="dataList"></div>
      </div>

      <div class="twoBox" style="display: block" id="rightContainer">
        <div id="toggleDisplay">
          <h2 id="welcomeHeading">Welcome to the Discussion Portal</h2>
          <div id="rightDiv">
            <input type="text" id="subject" placeholder="Subject" />
          </div>
          <div id="rightDiv">
            <textarea
              id="question"
              placeholder="Write your query description here..."
            ></textarea>
          </div>
          <div style="float: right">
            <button type="button" id="submitBtn">Submit</button>
          </div>
        </div>
        <div id="respondQue"></div>
        <div id="resolveHolder" style="display: none">
          <button id="resolveQuestion">
            <i class="fa-solid fa-circle-check"></i> Resolve
          </button>
          <button id="upvote">
            <i class="fa-solid fa-thumbs-up"></i> upvote
          </button>
          <button id="downvote">
            <i class="fa-solid fa-thumbs-down"></i> downvote
          </button>
        </div>
        <div id="responseAns"></div>
        <div id="commentHolder" style="display: none">
          <input id="pickName" placeholder="Write your name.." />
          <textarea
            name=""
            id="pickComment"
            placeholder="write your answer here..."
          ></textarea>
          <button id="commentBtn">
            <i class="fa-regular fa-comment"></i> Comment
          </button>
        </div>
      </div>
    </div>
    <script src="dapp.js"></script>
  </body>
</html>
